<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracias</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #e8f7ff, #d9efff, #eef5ff);
            color: #24384b;
            padding: 24px 16px;
        }
        .card {
            width: min(100%, 700px);
            background: rgba(255,255,255,0.72);
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 26px;
            box-shadow: 0 20px 50px rgba(62, 115, 158, 0.16);
            padding: 40px 30px;
            text-align: center;
        }
        h1 {
            margin: 0 0 18px;
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            color: #24577f;
        }
        p {
            margin: 0 0 26px;
            font-size: 1.08rem;
            line-height: 1.8;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .btn {
            text-decoration: none;
            color: #fff;
            background: linear-gradient(135deg, #55b8e8, #5686d8);
            padding: 12px 22px;
            border-radius: 999px;
            font-weight: bold;
            box-shadow: 0 10px 22px rgba(72, 143, 202, 0.25);
            text-align: center;
        }
        @media (max-width: 480px) {
            .card {
                padding: 32px 22px;
                border-radius: 22px;
            }
            h1 {
                font-size: clamp(2rem, 10vw, 2.7rem);
            }
            p {
                font-size: 1rem;
                line-height: 1.7;
            }
            .actions {
                flex-direction: column;
                gap: 12px;
            }
            .btn {
                width: 100%;
                padding: 14px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Gracias por leer esto</h1>
        <p>Quiero que sepas que esto lo escribí con sinceridad y con miedo de perder tu amistad  </p>
        <div class="actions">
            <a class="btn" href="index2.html">Volver</a>
            <a class="btn" href="index.html">Inicio</a>
        </div>
    </div>
</body>
</html>
