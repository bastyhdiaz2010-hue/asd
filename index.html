<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONFESION</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #e5f6ff, #d7edff, #eef5ff);
            color: #20364d;
            padding: 24px 16px;
        }
        .card {
            width: min(100%, 700px);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(62, 115, 158, 0.18);
            padding: 40px 30px;
            text-align: center;
        }
        h1 {
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            margin: 0 0 18px;
            color: #24577f;
        }
        h2 {
            font-size: 1.3rem;
            margin: 0 0 20px;
            color: #527b9b;
        }
        p {
            font-size: 1.05rem;
            line-height: 1.8;
            margin: 0 0 26px;
        }
        .btn {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(135deg, #55b8e8, #5686d8);
            padding: 12px 24px;
            border-radius: 999px;
            font-weight: bold;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 20px rgba(72, 143, 202, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        @media (max-width: 480px) {
            .card {
                padding: 32px 22px;
                border-radius: 20px;
            }
            h1 {
                font-size: clamp(2rem, 10vw, 2.7rem);
            }
            h2 {
                font-size: 1.1rem;
                line-height: 1.5;
            }
            p {
                font-size: 1rem;
                line-height: 1.7;
            }
            .btn {
                width: 100%;
                padding: 14px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hola Fernanda</h1>
        <h2>quizas te preguntes ¿qué es esto?</h2>
        <p>bueno esto es una confesión que hice para que sepas que siento algo por ti claramente.</p>
        <a class="btn" href="index2.html">Leer mi confesión</a>
    </div>
</body>
</html>
